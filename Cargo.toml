[workspace]
resolver = "3"
members = ["crates/pipeline"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Egor-Liadsky/pipeline-mcp-agent"

[workspace.dependencies]
anyhow = "1.0.104"
hex = "0.4"
rmcp = { version = "3.4.0", default-features = false }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
tokio = { version = "1.53.1", features = ["full"] }
